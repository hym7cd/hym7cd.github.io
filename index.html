<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄月明 · 产品作品集</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 基础 ===== */
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --ink:#101318;
  --ink-2:#4a5260;
  --ink-3:#8b93a1;
  --line:#e4e6eb;
  --accent:#1f5eff;
  --accent-soft:#eaf0ff;
  --radius:18px;
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Inter","Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.65;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:#fff}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

/* ===== 导航 ===== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  transition:background .35s ease, box-shadow .35s ease, height .35s ease;
  height:72px;display:flex;align-items:center;
}
.nav.solid{
  background:rgba(244,245,247,.82);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  box-shadow:0 1px 0 var(--line);
  height:60px;
}
.nav .wrap{width:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em}
.brand-mark{
  width:26px;height:26px;border-radius:8px;
  background:linear-gradient(135deg,#1f5eff,#5dd0ff);
  position:relative;overflow:hidden;
}
.brand-mark::after{
  content:"";position:absolute;inset:7px;border:2px solid #fff;border-radius:50%;
  opacity:.9;
}
.links{display:flex;align-items:center;gap:28px;font-size:14px;color:var(--ink-2)}
.links a{position:relative;padding:4px 0;transition:color .2s}
.links a:hover{color:var(--ink)}
.links a::after{
  content:"";position:absolute;left:0;bottom:0;height:1.5px;width:0;background:var(--accent);
  transition:width .25s ease;
}
.links a:hover::after{width:100%}
.nav-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;
  font-size:13.5px;transition:transform .2s, background .2s;
}
.nav-btn:hover{transform:translateY(-1px);background:#243044}
.menu-toggle{display:none;background:none;border:0;cursor:pointer;padding:8px}
.menu-toggle span{display:block;width:20px;height:1.5px;background:var(--ink);margin:4px 0;transition:.25s}

/* ===== Hero ===== */
.hero{padding:150px 0 90px;position:relative}
.hero-grid{
  display:grid;grid-template-columns:1.35fr .65fr;gap:48px;align-items:center;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;
  border:1px solid var(--line);background:#fff;
  padding:6px 14px;border-radius:99px;margin-bottom:26px;
}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
h1{
  font-size:clamp(38px,5.4vw,66px);
  line-height:1.12;letter-spacing:-.03em;font-weight:700;
  margin-bottom:22px;
}
h1 em{
  font-style:normal;
  background:linear-gradient(100deg,#1f5eff,#00b8d9 60%,#5dd0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-sub{font-size:17px;color:var(--ink-2);max-width:520px;margin-bottom:34px;font-weight:400}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:13px 24px;border-radius:99px;font-size:14.5px;font-weight:500;
  transition:transform .2s, box-shadow .2s, background .2s, border-color .2s;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px -10px rgba(31,94,255,.6)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(31,94,255,.7)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-ghost:hover{transform:translateY(-2px);border-color:#cfd3db}
.arrow{transition:transform .25s}
.btn:hover .arrow{transform:translateX(3px)}

/* Hero 视觉 */
.hero-visual{
  aspect-ratio:1/1;position:relative;
  border-radius:24px;overflow:hidden;
  background:radial-gradient(circle at 28% 22%,#eaf1ff 0%,#f7f9ff 45%,#eef0f4 100%);
  border:1px solid #fff;
  box-shadow:0 30px 60px -40px rgba(16,19,24,.4), inset 0 1px 0 #fff;
}
.dots{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(31,94,255,.18) 1px,transparent 1px);
  background-size:20px 20px;
  mask-image:radial-gradient(circle at 60% 45%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 60% 45%,#000 20%,transparent 78%);
}
.orbit{
  position:absolute;border:1px solid rgba(31,94,255,.22);border-radius:50%;
}
.o1{width:76%;height:76%;left:12%;top:12%;animation:spin 26s linear infinite}
.o2{width:52%;height:52%;left:24%;top:24%;border-style:dashed;animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:112px;height:112px;border-radius:28px;
  background:linear-gradient(140deg,#1f5eff,#0aa5d8);
  box-shadow:0 20px 40px -18px rgba(31,94,255,.65), inset 0 1px 0 rgba(255,255,255,.5);
  display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.16em;
}
.tag-float{
  position:absolute;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;font-size:12px;color:var(--ink-2);
  box-shadow:0 10px 24px -16px rgba(16,19,24,.5);
}
.t1{left:8%;top:24%;animation:float 7s ease-in-out infinite}
.t2{right:7%;top:56%;animation:float 8s ease-in-out infinite .6s}
.t3{left:18%;bottom:13%;animation:float 9s ease-in-out infinite .3s}
@keyframes float{50%{transform:translateY(-9px)}}

/* ===== 数据条 ===== */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-top:20px;
}
.stat{padding:30px 10px 26px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:30px;letter-spacing:-.02em;font-weight:700}
.stat span{font-size:13px;color:var(--ink-3)}

/* ===== 通用 section ===== */
section{padding:96px 0}
.sec-head{margin-bottom:48px;max-width:640px}
.sec-tag{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em;line-height:1.25;font-weight:700}
.sec-desc{color:var(--ink-2);margin-top:14px;font-size:15.5px}

/* ===== 关于 ===== */
.about{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.about p{color:var(--ink-2);font-size:15.5px;margin-bottom:18px}
.about p b{color:var(--ink);font-weight:600}
.skills{display:flex;flex-direction:column;gap:22px}
.skill-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:9px;font-weight:500}
.skill-row .top span:last-child{color:var(--ink-3);font-size:12.5px;font-weight:400}
.bar{height:6px;background:#e7e9ee;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1f5eff,#4fc3ff);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.chip{font-size:13px;padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}

/* ===== 作品 ===== */
.works{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.work{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .3s ease, box-shadow .3s ease, border-color .3s;
}
.work:hover{transform:translateY(-4px);box-shadow:0 26px 50px -32px rgba(16,19,24,.45);border-color:#d3d8e2}
.work-cover{
  aspect-ratio:16/9;position:relative;overflow:hidden;
  display:grid;place-items:center;
}
.work-cover .glyph{font-size:44px;font-weight:700;letter-spacing:-.03em;color:rgba(255,255,255,.95)}
.work-cover .meta-line{
  position:absolute;left:22px;bottom:18px;right:22px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:rgba(255,255,255,.78);letter-spacing:.1em;text-transform:uppercase;
}
.c1{background:linear-gradient(135deg,#1a2b6d,#3b76ff)}
.c2{background:linear-gradient(135deg,#123a35,#1fae8f)}
.c3{background:linear-gradient(135deg,#3a2450,#9163d6)}
.c4{background:linear-gradient(135deg,#4a2d1c,#e2784a)}
.work-body{padding:26px 26px 28px;display:flex;flex-direction:column;gap:12px;flex:1}
.work-body h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.work-body p{font-size:14px;color:var(--ink-2);flex:1}
.work-tags{display:flex;flex-wrap:wrap;gap:7px}
.work-tags span{font-size:11.5px;color:var(--ink-3);background:#f2f4f7;padding:4px 10px;border-radius:6px}
.work-link{font-size:13.5px;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:6px}

/* ===== 经历 ===== */
.timeline{border-left:1px solid var(--line);padding-left:34px;display:flex;flex-direction:column;gap:38px;margin-left:6px}
.tl-item{position:relative}
.tl-item::before{
  content:"";position:absolute;left:-40px;top:7px;
  width:11px;height:11px;border-radius:50%;background:#fff;
  border:2px solid var(--accent);
}
.tl-item .when{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px}
.tl-item h4{font-size:17px;font-weight:600;margin-bottom:4px}
.tl-item .role{font-size:13.5px;color:var(--accent);margin-bottom:8px}
.tl-item p{font-size:14px;color:var(--ink-2);max-width:640px}

/* ===== 联系 ===== */
.contact{
  background:linear-gradient(160deg,#111826 0%,#1b2740 55%,#123a5e 100%);
  border-radius:28px;padding:64px 56px;color:#fff;position:relative;overflow:hidden;
}
.contact::before{
  content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;
  border-radius:50%;background:radial-gradient(circle,rgba(79,195,255,.35),transparent 65%);
}
.contact h2{color:#fff;margin-bottom:14px}
.contact p{color:rgba(255,255,255,.66);max-width:520px;font-size:15px;margin-bottom:32px}
.contact-links{display:flex;flex-wrap:wrap;gap:12px;position:relative}
.contact-links a{
  display:inline-flex;align-items:center;gap:9px;
  padding:12px 20px;border-radius:99px;font-size:14px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
  transition:background .2s, transform .2s;
}
.contact-links a:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.contact-links a.primary{background:#fff;color:#111826;border-color:#fff;font-weight:500}
footer{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding:40px 0 48px;font-size:13px;color:var(--ink-3);
}

/* ===== 动效 ===== */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ===== 响应式 ===== */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .hero-visual{max-width:420px}
  .about{grid-template-columns:1fr;gap:44px}
  .works{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}
}
@media (max-width:760px){
  .links{display:none}
  .menu-toggle{display:block}
  .nav-btn{display:none}
  .hero{padding:120px 0 64px}
  section{padding:70px 0}
  .contact{padding:44px 28px;border-radius:20px}
  .timeline{padding-left:26px}
  .tl-item::before{left:-32px}
  .wrap{padding:0 20px}
}
/* 移动端抽屉 */
.drawer{
  position:fixed;inset:60px 0 auto 0;background:rgba(244,245,247,.98);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  display:none;flex-direction:column;padding:18px 24px 26px;z-index:99;gap:4px;
}
.drawer.open{display:flex}
.drawer a{padding:12px 4px;font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--line)}
</style>
</head>

<header class="nav" id="nav">

    <nav class="links">
      <a href="#about">关于</a>
      <a href="#works">作品</a>
      <a href="#experience">经历</a>
      <a href="#contact">联系</a>
    </nav>
    <a href="#contact" class="nav-btn">合作联系</a>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span></button>
  </div>
</header>
<div class="drawer" id="drawer">
  <a href="#about">关于</a>
  <a href="#works">作品</a>
  <a href="#experience">经历</a>
  <a href="#contact">联系</a>

<main id="top">

  <section id="experience"><div class="wrap"><div class="sec-head reveal" id="expHead"></div><div class="timeline" id="expBox"></div></div></section>
  <section id="contact" style="padding-top:20px">
    <div class="wrap">
      <div class="contact reveal" id="contactBox"></div>
      <footer id="footerBox"></footer>
    </div>
  </section>
</main>

      { "label": "✉ hello@example.com", "href": "mailto:hello@example.com", "primary": true },
      { "label": "GitHub", "href": "https://github.com/hym7cd" },
      { "label": "微信", "href": "#" }
    ]
  },
  "footer": { "left": "© 2026 黄月明 · 个人作品集", "right": "以简洁为原则，持续迭代" }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== 渲染 ===== */
function render(d){
  document.getElementById('brandName').textContent = d.brand || '';
  document.title = (d.brand || '') + ' · 产品作品集';

  const h = d.hero || {};
  document.getElementById('heroBox').innerHTML = `
    <div>
      <div class="eyebrow"><span class="dot"></span> ${esc(h.badge)}</div>
      <h1>${esc(h.titleA)}<br>${esc(h.titleB)}<em>${esc(h.titleC)}</em>${esc(h.titleD)}</h1>
      <p class="hero-sub">${esc(h.desc)}</p>
      <div class="hero-actions">
        <a href="${esc((h.primary||{}).href || '#works')}" class="btn btn-primary">${esc((h.primary||{}).label || '查看作品')} <span class="arrow">→</span></a>
        <a href="${esc((h.secondary||{}).href || '#contact')}" class="btn btn-ghost">${esc((h.secondary||{}).label || '联系方式')}</a>
      </div>
    </div>
    <div class="hero-visual reveal">
      <div class="dots"></div>
      <div class="orbit o1"></div>
      <div class="orbit o2"></div>
      <div class="core">${esc(h.core || 'PM')}</div>
      ${['t1','t2','t3'].map((c,i)=>`<div class="tag-float ${c}">${esc((h.tags||[])[i] || '')}</div>`).join('')}
    </div>`;

  document.getElementById('statsBox').innerHTML = (d.stats||[]).map(s =>
    `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');

  const a = d.about || {};
  document.getElementById('aboutBox').innerHTML = `
    <div class="reveal">
      <div class="sec-tag">${esc(a.tag)}</div>
      <h2>${esc(a.heading)}</h2>
      ${(a.paragraphs||[]).map((p,i)=>`<p style="margin-top:${i===0?'18px':'0'}">${p}</p>`).join('')}
    </div>
    <div class="reveal">
      <div class="sec-tag">Skills</div>
      <div class="skills">
        ${(a.skills||[]).map(s=>`
          <div class="skill-row">
            <div class="top"><span>${esc(s.name)}</span><span>${esc(s.note)}</span></div>
            <div class="bar"><i data-w="${Number(s.weight)||0}"></i></div>
          </div>`).join('')}
      </div>
      <div class="chips" style="margin-top:26px">${(a.chips||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
    </div>`;

  const w = d.works || {};
  document.getElementById('worksHead').innerHTML = `
    <div class="sec-tag">${esc(w.tag)}</div><h2>${esc(w.heading)}</h2><p class="sec-desc">${esc(w.desc)}</p>`;
  document.getElementById('worksBox').innerHTML = (w.items||[]).map(it => `
    <article class="work reveal">
      <div class="work-cover ${esc(it.theme || 'c1')}">
        <div class="glyph">${esc(it.no)}</div>
        <div class="meta-line"><span>${esc(it.kicker)}</span><span>${esc(it.period)}</span></div>
      </div>
      <div class="work-body">
        <h3>${esc(it.title)}</h3>
        <p>${esc(it.desc)}</p>
        <div class="work-tags">${(it.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
        <a href="#contact" class="work-link">了解详情 <span>→</span></a>
      </div>
    </article>`).join('');

  const e = d.experience || {};
  document.getElementById('expHead').innerHTML = `<div class="sec-tag">${esc(e.tag)}</div><h2>${esc(e.heading)}</h2>`;
  document.getElementById('expBox').innerHTML = (e.items||[]).map(it => `
    <div class="tl-item reveal">
      <div class="when">${esc(it.period)}</div>
      <h4>${esc(it.company)}</h4>
      <div class="role">${esc(it.role)}</div>
      <p>${esc(it.desc)}</p>
    </div>`).join('');

  const c = d.contact || {};
  document.getElementById('contactBox').innerHTML = `
    <h2>${esc(c.heading)}</h2>
    <p>${esc(c.text)}</p>
    <div class="contact-links">${(c.links||[]).map(l =>
      `<a href="${esc(l.href)}"${l.primary?' class="primary"':''}${l.href && l.href.indexOf('http')===0?' target="_blank" rel="noopener"':''}>${esc(l.label)}</a>`).join('')}</div>`;

  const f = d.footer || {};
  document.getElementById('footerBox').innerHTML = `<span>${esc(f.left)}</span><span>${esc(f.right)}</span>`;
}

/* ===== 动效 ===== */
function initMotion(){
  const nav = document.getElementById('nav');
  const onScroll = () => nav.classList.toggle('solid', window.scrollY > 24);
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  const drawer = document.getElementById('drawer');
  document.getElementById('menuToggle').onclick = () => drawer.classList.toggle('open');
  drawer.onclick = e => { if(e.target.tagName === 'A') drawer.classList.remove('open'); };

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(!en.isIntersecting) return;
      en.target.classList.add('in');
      io.unobserve(en.target);
    });
  }, {threshold:.14, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach((el,i) => {
    el.style.transitionDelay = (i % 4) * 0.06 + 's';
    io.observe(el);
  });

  const barIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(!en.isIntersecting) return;
      en.target.querySelectorAll('.bar i').forEach((bar,i) => {
        setTimeout(() => bar.style.width = bar.dataset.w + '%', i*120);
      });
      barIO.unobserve(en.target);
    });
  }, {threshold:.3});
  const skillBox = document.querySelector('.skills');
  if(skillBox) barIO.observe(skillBox);

  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const id = a.getAttribute('href');
      if(id.length < 2) return;
      const target = document.querySelector(id);
      if(!target) return;
      e.preventDefault();
      const top = target.getBoundingClientRect().top + window.scrollY - 64;
      window.scrollTo({top, behavior:'smooth'});
    });
  });
}

/* ===== 启动 ===== */
(async function(){
  let data = FALLBACK;
  try{
    const res = await fetch('data.json?_=' + Date.now(), {cache:'no-store'});
    if(res.ok){
      const json = await res.json();
      if(json && json.hero) data = json;
    }
  }catch(err){ /* 本地双击打开时回落到内置数据 */ }
  render(data);
  initMotion();
})();
</script>
